<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; border-radius: 8px; padding: 32px; border: 1px solid #334155; }
    .header { text-align: center; border-bottom: 1px solid #334155; padding-bottom: 20px; }
    .header h1 { color: #38bdf8; margin: 0; font-size: 24px; }
    .content { padding: 24px 0; line-height: 1.6; font-size: 15px; color: #cbd5e1; }
    .code-box { background: #0f172a; padding: 16px; border-radius: 6px; text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #38bdf8; border: 1px dashed #38bdf8; margin: 20px 0; }
    .btn { display: inline-block; background: #2563eb; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; margin-top: 16px; }
    .footer { text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #334155; padding-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SecureAssess Verification</h1>
    </div>
    <div class="content">
      <p>Hello,</p>
      <p>Please use the verification code below to verify your SecureAssess account email address:</p>
      <div class="code-box">{{code}}</div>
      <p>This code is valid for 15 minutes. If you did not request this, please ignore this email.</p>
    </div>
    <div class="footer">
      <p>&copy; 2026 SecureAssess. Trusted Assessments. Confident Decisions.</p>
    </div>
  </div>
</body>
</html>
