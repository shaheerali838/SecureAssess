<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 580px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 32px; border: 1px solid #334155; }
    .title { color: #f97316; font-size: 24px; font-weight: bold; margin: 0; }
    .content { line-height: 1.6; color: #cbd5e1; font-size: 15px; margin-top: 16px; }
    .btn { display: inline-block; background: #f97316; color: #ffffff !important; font-weight: 600; text-decoration: none; padding: 12px 28px; border-radius: 8px; margin-top: 16px; }
    .footer { margin-top: 32px; font-size: 12px; color: #64748b; text-align: center; border-top: 1px solid #334155; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Interview Starting Soon</h1>
    <div class="content">
      <p>Hello <strong>{{candidateName}}</strong>,</p>
      <p>Your scheduled video interview starts in <strong>{{startsIn}}</strong>.</p>
      <a href="{{interviewRoomUrl}}" class="btn">Enter Interview Lobby</a>
    </div>
    <div class="footer">
      <p>© 2026 SecureAssess. AI-Powered Examination & Integrity Platform.</p>
    </div>
  </div>
</body>
</html>
