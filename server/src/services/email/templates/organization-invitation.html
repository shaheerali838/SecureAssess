<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Organization Invitation</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 40px 20px; }
    .container { max-width: 580px; margin: 0 auto; background-color: #1e293b; border-radius: 12px; padding: 32px; border: 1px solid #334155; }
    .header { text-align: center; margin-bottom: 24px; }
    .title { color: #6366f1; font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .btn { display: inline-block; background-color: #6366f1; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; text-align: center; margin-top: 16px; }
    .footer { text-align: center; margin-top: 32px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">SecureAssess Organization Invitation</div>
    </div>
    <p>Hello,</p>
    <p>You have been invited to join <strong>{{organizationName}}</strong> on SecureAssess as a <strong>{{roleName}}</strong>.</p>
    
    <div style="text-align: center;">
      <a href="{{invitationUrl}}" class="btn">Accept Invitation</a>
    </div>

    <div class="footer">
      &copy; SecureAssess Enterprise Examination Engine. All rights reserved.
    </div>
  </div>
</body>
</html>
