<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 8px; max-width: 500px; margin: auto; }
    .btn { background: #6366f1; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Welcome to SecureAssess</h2>
    <p>Hi {{name}},</p>
    <p>Your account has been created successfully. Welcome to next-gen secure assessments and interviews.</p>
    <a href="{{loginUrl}}" class="btn">Login to Dashboard</a>
  </div>
</body>
</html>
